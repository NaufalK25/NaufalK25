name: Recent Activity

on:
  schedule:
    - cron: "30 17 * * *" # UTC+7
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "Update recent activity"
          MAX_LINES: 5
