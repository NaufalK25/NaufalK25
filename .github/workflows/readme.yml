name: Readme

on:
  schedule:
    - cron: "0 17 * * *" # UTC+7
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "assets/github-metrics.svg"]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/github-metrics.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_anilist: yes
          plugin_anilist_user: NaufalK25
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SHOW_COMMIT: True
          SHOW_DAYS_OF_WEEK: True
          SHOW_LANGUAGE: True
          SHOW_LANGUAGE_PER_REPO: True
          SHOW_LOC_CHART: True
          SHOW_OS: False
          SHOW_PROJECTS: False
          SHOW_EDITORS: False
          SHOW_TIMEZONE: False
          SHOW_LINES_OF_CODE: False
          SHOW_PROFILE_VIEWS: False
          SHOW_SHORT_INFO: False
          SHOW_UPDATED_DATE: False
          SHOW_TOTAL_CODE_TIME: False
          IGNORED_REPOS: "html-best-practices, return-youtube-dislike, cspell, cspell-dicts, vscode-material-icon-theme, nitro, material-icon-browser-extension, nerd-fonts, vscode, vscode-icons"
