name: WakaTime

on:
  schedule:
    - cron: "15 17 * * *" # UTC+7, offset from metrics.yml to avoid push conflicts
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["README.md", "assets/github-metrics.svg"]

jobs:
  update-readme:
    name: Update WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SHOW_COMMIT: True
          SHOW_DAYS_OF_WEEK: True
          SHOW_LANGUAGE: True
          SHOW_LANGUAGE_PER_REPO: True
          SHOW_LOC_CHART: True
          SHOW_OS: False
          SHOW_PROJECTS: False
          SHOW_EDITORS: False
          SHOW_TIMEZONE: False
          SHOW_LINES_OF_CODE: False
          SHOW_PROFILE_VIEWS: False
          SHOW_SHORT_INFO: False
          SHOW_UPDATED_DATE: False
          SHOW_TOTAL_CODE_TIME: False
          IGNORED_REPOS: "html-best-practices, return-youtube-dislike, cspell, cspell-dicts, vscode-material-icon-theme, nitro, material-icon-browser-extension, nerd-fonts, vscode, vscode-icons"
